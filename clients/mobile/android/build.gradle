buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 24
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        // RN 0.87's template value. Keep it in lockstep with the KGP that
        // @react-native/gradle-plugin is built against (its includeBuild loads
        // those classes into the parent classloader; on RN 0.86 a kotlinVersion
        // above the plugin's 2.1.20 died at configuration with a
        // KotlinJvmCompilerOptions.getJvmDefault NoSuchMethod clash). See
        // node_modules/@react-native/gradle-plugin/gradle/libs.versions.toml.
        // Kotlin 2.2 reads library metadata up to 2.3. react-native-iap is still
        // held at 16.0.2 on purpose (live purchase flow): 17.0.1 (openiap 4.0.1,
        // Kotlin 2.2 metadata) was trial-built on this toolchain and compiles,
        // so the old Kotlin 2.4-metadata blocker no longer applies — move to it
        // in its own change, with a Play internal-track purchase test.
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"
