[package]
name = "cumulusvpn-tunnel"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
license = "MIT"
description = "CumulusVPN tunnel engine: wireguard-go sidecar, routes, kill switch and wg-tls bridge."

# The one copy of the tunnel. It runs in two places: inside the root
# `cumulusvpn-helper` daemon on macOS, and inside the app process itself on
# Linux and Windows. No Tauri and no IPC here. Wherever this crate runs, it
# runs with privilege, so the dependency list is kept to what the tunnel
# actually needs.
[dependencies]
cumulusvpn-protocol = { path = "../protocol" }
thiserror = "2.0.21"
base64 = "0.23.1"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "io-util", "net", "time"] }
# wg-tls transport: the client-side UDP<->TLS bridge (see tlsbridge.rs).
# rustls is pure Rust (no OpenSSL) so it cross-compiles as cleanly as the
# amneziawg-go sidecar; the cert is NOT verified (camouflage only — trust is the
# inner WireGuard handshake), so no root store / webpki is needed.
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }

[dev-dependencies]
# Self-signed cert generation for the wg-tls bridge loopback test (ring backend,
# matching the runtime crypto provider — no aws-lc-rs/cmake).
rcgen = { version = "0.14.10", default-features = false, features = ["ring"] }
