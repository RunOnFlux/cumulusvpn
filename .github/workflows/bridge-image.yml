name: bridge-image

# Build and publish the payments-bridge container to GHCR, and run its checks
# on every PR that touches it. The bridge is OPERATOR infrastructure — it is
# deployed by hand (docker pull + env file), never via a Flux app spec,
# because it holds the treasury key and payment-provider secrets.

on:
  push:
    branches: [main]
    paths:
      - 'bridge/**'
      - '.github/workflows/bridge-image.yml'
    tags:
      - 'bridge-v*'
  pull_request:
    paths:
      - 'bridge/**'
      # the bridge's price tests run the gateway's cross-language vectors
      - 'gateway/internal/price/testdata/**'
      - '.github/workflows/bridge-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/runonflux/cumulusvpn-bridge

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn typecheck
      - run: yarn lint
      - run: yarn format:check
      - run: yarn test
      - run: yarn build

  image:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags & labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=match,pattern=bridge-v(\d+\.\d+\.\d+),group=1

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: bridge
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
