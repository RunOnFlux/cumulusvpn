name: ci-gateway

# Go CI for both of the repo's Go modules: the gateway, and the wgnest tunnel
# core the mobile apps embed.
#
# wgnest was uncovered until 2026-08-25. android-release.yml references it, but
# only to run `gomobile bind` on a tag — it never ran a test, so the code that
# IS the mobile data plane (two stacked wireguard-go devices, the roam rebind)
# could break on main and nothing would say so.
on:
  push:
    branches: [main]
    paths:
      - 'gateway/**'
      - 'clients/native/**'
      - '.github/workflows/ci-gateway.yml'
  pull_request:
    paths:
      - 'gateway/**'
      - 'clients/native/**'
      - '.github/workflows/ci-gateway.yml'

permissions:
  contents: read

concurrency:
  group: ci-gateway-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway:
    name: build & test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gateway
            dir: gateway
          - name: wgnest
            dir: clients/native/wgnest
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # setup-go runs with GOTOOLCHAIN=local, so this must be >= every go.mod
          # `go` line in the matrix (gateway: go 1.26.0, toolchain go1.27.2 — the
          # same Go as gateway/Dockerfile). wgnest (go 1.25.0) builds fine on it.
          go-version: '1.27'
          cache-dependency-path: ${{ matrix.dir }}/go.sum

      # gofmt is authoritative; fail the build if anything is unformatted.
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi
          echo "gofmt: clean"

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test (race + coverage)
        run: go test ./... -race -covermode=atomic -coverprofile=coverage.out

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

  # Optional deeper static analysis; advisory only so it never blocks a merge.
  golangci:
    name: golangci-lint (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27' # match the gateway's go.mod toolchain (see above)
          cache-dependency-path: gateway/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # v8 installs golangci-lint v2 (built with a current Go toolchain, so it
          # can analyze our `go 1.25` target — v1.64.x was built with go1.24 and
          # errored "language version go1.24 < targeted 1.25"). --no-config runs
          # the default (standard) linters without a v2 config file; advisory job,
          # so --issues-exit-code=0 keeps the check green while still annotating.
          version: latest
          working-directory: gateway
          args: --no-config --issues-exit-code=0
