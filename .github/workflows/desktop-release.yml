name: desktop-release

# CumulusVPN desktop installers, built with tauri-action and published to a
# GitHub Release: macOS (Apple Silicon) .dmg/.app and Linux (x86_64)
# .deb/.rpm/.AppImage.
#
# Platform notes:
# - Intel Macs are deliberately dropped (obsolete).
# - Windows is NOT built yet — not because of CI, but because the app's route
#   programming is a marked seam on Windows (routing.rs errors on any
#   not-macos/linux path) and wintun.dll is not bundled, so an installer would
#   produce a tunnel that routes nothing. Implement the netsh/route-based
#   routing + wintun packaging first, then add
#   { runner: windows-latest, target: x86_64-pc-windows-msvc, bundles: 'msi,nsis' }.
# - The wireguard-go (AmneziaWG) sidecar is cross-built from source per target
#   by fetch-wireguard-go.sh (pure Go, CGO off) — no prebuilt downloads.
#
# Trigger: push a tag like `desktop-v1.2.3`, or run manually (manual runs only
# BUILD — no release is created, useful to CI-validate a new matrix leg).
#
# Required secret: TAURI_SIGNING_PRIVATE_KEY (+ _PASSWORD) for the updater.
# Optional (Gatekeeper-clean .dmg): APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD,
# APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID. See docs/14-releases.md.

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest # Apple Silicon runner
            target: aarch64-apple-darwin
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Tauri's Linux backend is webkit2gtk; the tray needs appindicator.
      - name: Linux system deps (webkit2gtk / gtk / appindicator)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      # fetch-wireguard-go.sh builds the wireguard-go sidecar from source (pure
      # Go, CGO disabled), so the runner needs a Go toolchain (>= 1.23).
      - name: Setup Go (for the wireguard-go sidecar)
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'

      - name: Install deps + build shared core
        run: |
          yarn install --immutable
          yarn workspace @cumulusvpn/core build

      - name: Build wireguard-go sidecar (${{ matrix.target }})
        run: bash clients/desktop/scripts/fetch-wireguard-go.sh ${{ matrix.target }}
        shell: bash

      - name: Build + release (tauri-action)
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple code-signing / notarization is intentionally OFF for now: the
          # APPLE_* secrets aren't set, and passing them EMPTY makes tauri-action
          # try `security import` with an empty cert and fail. Result: an UNSIGNED
          # .dmg (right-click → Open to bypass Gatekeeper). To enable notarized
          # builds later, add the APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD /
          # APPLE_SIGNING_IDENTITY / APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID
          # repository secrets and re-add them as env here (see docs/14-releases.md).
        with:
          projectPath: clients/desktop
          # On a manual dispatch tagName is empty, so tauri-action only builds —
          # no draft release named after a branch.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('CumulusVPN Desktop {0}', github.ref_name) || '' }}
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}
