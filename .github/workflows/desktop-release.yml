name: desktop-release

# CumulusVPN desktop installers, built with tauri-action and published to a
# GitHub Release: macOS (Apple Silicon) .dmg/.app, Linux (x86_64)
# .deb/.rpm/.AppImage, and Windows (x86_64) NSIS + MSI.
#
# Platform notes:
# - Intel Macs are deliberately dropped (obsolete).
# - Every leg ships the privileged `cumulusvpn-helper` daemon, so the app runs
#   unprivileged (see clients/desktop/README.md). Each platform's
#   beforeBuildCommand runs scripts/build-helper.mjs, which builds the helper
#   for the leg's --target and stages it in src-tauri/helper/build/; the
#   platform config bundles it:
#     macOS   tauri.macos.conf.json   → LaunchDaemon in the .app (SMAppService)
#     Linux   tauri.linux.conf.json   → /usr/bin + a systemd unit in the
#                                       .deb/.rpm, with maintainer scripts;
#                                       the AppImage has no service and runs
#                                       the tunnel in-process when started
#                                       with sudo
#     Windows tauri.windows.conf.json → next to the app, registered as the
#                                       CumulusVPNHelper service by the NSIS
#                                       hooks / the MSI fragment (per-machine)
#   The verify steps after the build install the packages on the runner and
#   check the service, its permissions, peer authentication and uninstall
#   cleanup. macOS tag builds are Developer ID signed + notarized (the helper
#   must be, or SMAppService will not register it).
# - Windows: routing.rs drives netsh/PowerShell and wggo.rs speaks UAPI over
#   the named pipe, so the installer produces a working tunnel. wireguard-go
#   needs wintun.dll next to the exe: the step below fetches the pinned
#   official build (SHA256-verified) and tauri.windows.conf.json bundles it.
#   Signed with Azure Artifact Signing when the AZURE_* secrets/vars exist
#   (see the "Prepare Windows code signing" step); unsigned otherwise, and
#   SmartScreen warns. tauri `targets: "all"` emits NSIS + MSI.
# - The wireguard-go (AmneziaWG) sidecar is cross-built from source per target
#   by fetch-wireguard-go.sh (pure Go, CGO off) — no prebuilt downloads.
#
# Trigger: push a tag like `desktop-v1.2.3`, or run manually (manual runs only
# BUILD — no release is created, useful to CI-validate a new matrix leg).
#
# Required secrets: TAURI_SIGNING_PRIVATE_KEY (+ _PASSWORD) for the updater, and
# for macOS tag builds APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD,
# APPLE_SIGNING_IDENTITY ("Developer ID Application: … (276MY32G8B)"),
# APPLE_API_KEY (Key ID), APPLE_API_ISSUER (Issuer ID), APPLE_API_KEY_P8 (.p8
# contents). See docs/14-releases.md.

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: write
  # GitHub OIDC → Azure (Windows signing): no Azure secret is stored anywhere.
  id-token: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest # Apple Silicon runner
            target: aarch64-apple-darwin
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    # The Azure app trusts tokens for exactly this environment
    # (repo:RunOnFlux/cumulusvpn:environment:desktop-release).
    environment: desktop-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          # SHA-pinned (from master's history, per the action's README), so the
          # toolchain comes from this input instead of the @stable ref.
          toolchain: stable
          targets: ${{ matrix.target }}

      # Tauri's Linux backend is webkit2gtk; the tray needs appindicator.
      - name: Linux system deps (webkit2gtk / gtk / appindicator)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf rpm

      # fetch-wireguard-go.sh builds the wireguard-go sidecar from source (pure
      # Go, CGO disabled), so the runner needs a Go toolchain (>= 1.23).
      - name: Setup Go (for the wireguard-go sidecar)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'

      - name: Install deps + build shared core
        run: |
          yarn install --immutable
          yarn workspace @cumulusvpn/core build

      - name: Build wireguard-go sidecar (${{ matrix.target }})
        run: bash clients/desktop/scripts/fetch-wireguard-go.sh ${{ matrix.target }}
        shell: bash

      # wireguard-go on Windows drives the wintun driver, whose DLL must sit
      # next to the executable (its loader searches the application dir +
      # System32 only). Wintun's license permits redistribution with
      # WireGuard-compatible software; we vendor the pinned official build,
      # verified against the SHA256 published on wintun.net for this exact zip.
      # tauri.windows.conf.json bundles src-tauri/wintun/wintun.dll into the
      # install dir next to the app (and its sidecar).
      - name: Fetch wintun.dll (pinned + SHA256-verified)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $expected = '07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51'
          Invoke-WebRequest -Uri 'https://www.wintun.net/builds/wintun-0.14.1.zip' -OutFile wintun.zip
          $actual = (Get-FileHash wintun.zip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) { throw "wintun-0.14.1.zip SHA256 mismatch: got $actual" }
          Expand-Archive wintun.zip -DestinationPath wintun-unzip
          New-Item -ItemType Directory -Force -Path clients/desktop/src-tauri/wintun | Out-Null
          Copy-Item wintun-unzip/wintun/bin/amd64/wintun.dll clients/desktop/src-tauri/wintun/wintun.dll

      # macOS signing + notarization (Developer ID, team 276MY32G8B — must match
      # APPLE_TEAM_ID in src-tauri/helper/src/peer.rs). The certificate goes
      # into a throwaway keychain HERE rather than via tauri-action's
      # APPLE_CERTIFICATE, because scripts/build-helper.mjs signs the helper in
      # beforeBuildCommand, which runs before Tauri would import it. Tauri then
      # finds APPLE_SIGNING_IDENTITY in the keychain and signs the sidecar + app.
      # Notarization is NOT left to Tauri (it polls Apple once, with no retry,
      # and a runner network drop mid-wait failed desktop-v1.4.2 twice): the
      # API key goes out as CVPN_NOTARY_* — names Tauri does not read — and
      # scripts/notarize-macos.sh notarizes + staples after the build.
      # Values reach later steps through $GITHUB_ENV, so nothing is passed
      # empty. A tag build without the secrets FAILS: an unsigned .dmg is
      # reported as "damaged" by Gatekeeper and must never be released again.
      - name: Import Apple signing certificate + notarization key
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_SIGNING_IDENTITY" ] \
             || [ -z "$APPLE_API_KEY" ] || [ -z "$APPLE_API_ISSUER" ] || [ -z "$APPLE_API_KEY_P8" ]; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              echo "::error::Apple signing secrets are missing; refusing to release an unsigned macOS build."
              exit 1
            fi
            echo "::warning::Apple signing secrets not set; this manual build will be UNSIGNED (not for distribution)."
            exit 0
          fi
          case "$APPLE_SIGNING_IDENTITY" in
            *"(276MY32G8B)"*) ;;
            *) echo "::error::APPLE_SIGNING_IDENTITY is not from team 276MY32G8B (see helper/src/peer.rs)"; exit 1 ;;
          esac

          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          existing=()
          while IFS= read -r k; do existing+=("$k"); done < <(security list-keychains -d user | tr -d '" ' )
          security list-keychains -d user -s "$KEYCHAIN" "${existing[@]}"
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -F "$APPLE_SIGNING_IDENTITY"

          KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$KEY_PATH"
          {
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            echo "APPLE_KEYCHAIN=$KEYCHAIN"
            echo "CVPN_NOTARY_KEY_ID=$APPLE_API_KEY"
            echo "CVPN_NOTARY_ISSUER=$APPLE_API_ISSUER"
            echo "CVPN_NOTARY_KEY_PATH=$KEY_PATH"
            echo "CVPN_MAC_SIGNED=1"
          } >> "$GITHUB_ENV"

      # Windows signing: Azure Artifact Signing, Public Trust profile
      # zelcore-public-trust-us (InFlux Technologies USA LLC — same publisher as
      # the Mac build) in account zelcoresigningus. GitHub signs in to the
      # cumulusvpn-signing-ci Entra app via OIDC (federated credential for the
      # desktop-release environment); that app holds only the "Artifact Signing
      # Certificate Profile Signer" role on that one account. No client secret.
      # Vars: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID,
      # AZURE_CODE_SIGNING_ENDPOINT, AZURE_CODE_SIGNING_ACCOUNT_NAME,
      # AZURE_CERTIFICATE_PROFILE_NAME. When they exist, a Tauri config overlay
      # makes signCommand run scripts/sign-windows.ps1 on every binary +
      # installer, and build-helper.mjs signs the helper. Tag builds fail
      # without them; manual builds go unsigned with a warning.
      - name: Check Windows signing configuration
        id: winsign
        if: runner.os == 'Windows'
        shell: bash
        run: |
          missing=()
          for v in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_CODE_SIGNING_ENDPOINT \
                   AZURE_CODE_SIGNING_ACCOUNT_NAME AZURE_CERTIFICATE_PROFILE_NAME; do
            [ -n "${!v}" ] || missing+=("$v")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              echo "::error::Windows signing not configured (missing vars: ${missing[*]}); refusing to release unsigned installers."
              exit 1
            fi
            echo "::warning::Windows signing not configured (missing vars: ${missing[*]}); this manual build is UNSIGNED."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_CODE_SIGNING_ENDPOINT: ${{ vars.AZURE_CODE_SIGNING_ENDPOINT }}
          AZURE_CODE_SIGNING_ACCOUNT_NAME: ${{ vars.AZURE_CODE_SIGNING_ACCOUNT_NAME }}
          AZURE_CERTIFICATE_PROFILE_NAME: ${{ vars.AZURE_CERTIFICATE_PROFILE_NAME }}

      - name: Azure login (OIDC)
        if: runner.os == 'Windows' && steps.winsign.outputs.enabled == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Prepare Windows code signing (Azure Artifact Signing)
        if: runner.os == 'Windows' && steps.winsign.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # PSResourceGet ships with PowerShell 7.4+ (no NuGet provider bootstrap,
          # which only exists in Windows PowerShell 5). It installs per-user
          # modules where only pwsh looks, so the signCommand and
          # build-helper.mjs run pwsh, never powershell.exe.
          Install-PSResource -Name TrustedSigning -Version '[0.5.0,)' -Repository PSGallery -Scope CurrentUser -TrustRepository -Quiet
          Import-Module TrustedSigning
          Get-Command Invoke-TrustedSigning | Format-Table Name, Version, Source -AutoSize
          $script = (Resolve-Path clients/desktop/scripts/sign-windows.ps1).Path
          $overlay = Join-Path $env:RUNNER_TEMP 'tauri.windows-signing.conf.json'
          @{ bundle = @{ windows = @{ signCommand = @{
                cmd  = 'pwsh'
                args = @('-NoProfile', '-NonInteractive', '-ExecutionPolicy', 'Bypass', '-File', $script, '%1')
          } } } } | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8 $overlay
          Get-Content $overlay
          "CVPN_WIN_SIGN=1" >> $env:GITHUB_ENV
          "CVPN_TAURI_SIGN_ARGS=--config $overlay" >> $env:GITHUB_ENV

      - name: Build + release (tauri-action)
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Used by scripts/sign-windows.ps1 only when CVPN_WIN_SIGN=1
          # (credentials come from the az CLI session of the OIDC login).
          AZURE_CODE_SIGNING_ENDPOINT: ${{ vars.AZURE_CODE_SIGNING_ENDPOINT }}
          AZURE_CODE_SIGNING_ACCOUNT_NAME: ${{ vars.AZURE_CODE_SIGNING_ACCOUNT_NAME }}
          AZURE_CERTIFICATE_PROFILE_NAME: ${{ vars.AZURE_CERTIFICATE_PROFILE_NAME }}
          # macOS signing env (APPLE_SIGNING_IDENTITY, APPLE_KEYCHAIN) comes
          # from $GITHUB_ENV, set by the import step above only when the
          # secrets exist — never passed empty. No APPLE_API_*: Tauri must not
          # notarize (see the import step).
        with:
          projectPath: clients/desktop
          # On a manual dispatch tagName is empty, so tauri-action only builds —
          # no draft release named after a branch.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('CumulusVPN Desktop {0}', github.ref_name) || '' }}
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }} ${{ env.CVPN_TAURI_SIGN_ARGS }}

      # Notarize the .dmg (Apple covers the app inside it), staple the ticket
      # to the .dmg and the .app, and replace the unstapled .dmg tauri-action
      # uploaded to the draft release. Retries through runner network drops;
      # waits up to 5 h for a slow Apple queue (job limit is 6 h).
      - name: Notarize + staple (macOS)
        if: runner.os == 'macOS' && env.CVPN_MAC_SIGNED == '1'
        shell: bash
        working-directory: clients/desktop/src-tauri/target/${{ matrix.target }}/release/bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          dmg=$(ls dmg/*.dmg | head -n1)
          bash "$GITHUB_WORKSPACE/clients/desktop/scripts/notarize-macos.sh" "$dmg" macos/CumulusVPN.app
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            gh release upload "$GITHUB_REF_NAME" "$dmg" --clobber --repo "$GITHUB_REPOSITORY"
          fi

      # The helper must actually be in the bundle: without it the app can only
      # show its setup banner (or run as root).
      - name: Verify the macOS helper is bundled
        if: runner.os == 'macOS'
        shell: bash
        working-directory: clients/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos
        run: |
          set -euxo pipefail
          test -x CumulusVPN.app/Contents/MacOS/cumulusvpn-helper
          test -f CumulusVPN.app/Contents/Library/LaunchDaemons/com.cumulusvpn.helper.plist

      # A signed build must pass Gatekeeper exactly as a downloaded copy will:
      # every executable carries team 276MY32G8B, the seal is intact, and the
      # notarization ticket is stapled to the .app and to the .dmg. The app
      # inside the .dmg is checked too (notarized via the .dmg; Gatekeeper
      # finds its ticket online, and the .dmg's stapled ticket covers it).
      - name: Verify the macOS signature + notarization
        if: runner.os == 'macOS' && env.CVPN_MAC_SIGNED == '1'
        shell: bash
        working-directory: clients/desktop/src-tauri/target/${{ matrix.target }}/release/bundle
        run: |
          set -euxo pipefail
          check_app() {
            local app="$1"
            codesign --verify --deep --strict --verbose=2 "$app"
            for bin in cumulusvpn-desktop cumulusvpn-helper wireguard-go; do
              codesign -dv --verbose=4 "$app/Contents/MacOS/$bin" 2>&1 | tee "$RUNNER_TEMP/cs.txt"
              grep -q '^TeamIdentifier=276MY32G8B$' "$RUNNER_TEMP/cs.txt"
              grep -q 'flags=.*runtime' "$RUNNER_TEMP/cs.txt"
            done
            spctl --assess --type execute --verbose=4 "$app"
          }
          check_app macos/CumulusVPN.app
          xcrun stapler validate macos/CumulusVPN.app
          dmg=$(ls dmg/*.dmg | head -n1)
          codesign --verify --strict --verbose=2 "$dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg"
          mnt="$RUNNER_TEMP/dmg-mnt"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg"
          trap 'hdiutil detach "$mnt" || true' EXIT
          check_app "$mnt/CumulusVPN.app"

      # The runner has systemd, so install the .deb for real (docs/16 Stage J):
      # the service starts, its socket is root:cumulusvpn 0660, root is served,
      # a non-member is refused by the kernel, a member running anything but
      # the app is refused by the helper's peer check, and removing the
      # package stops, disables and cleans up.
      - name: Verify the Linux helper service (install, peer auth, removal)
        if: runner.os == 'Linux'
        shell: bash
        working-directory: clients/desktop/src-tauri/target/${{ matrix.target }}/release/bundle
        run: |
          set -euxo pipefail
          deb=$(ls deb/*.deb | head -n1)
          rpm=$(ls rpm/*.rpm | head -n1)

          # Print each listing before asserting on it, so a failure explains
          # itself. Tauri's bundlers write the .deb's data.tar entries as
          # `usr/bin/…` (no leading `./`, owner 0/0) and the .rpm's as absolute
          # paths; the helper must be executable, the unit must not.
          dpkg-deb -c "$deb" | tee "$RUNNER_TEMP/deb-contents.txt"
          grep -E '^-rwxr-xr-x .* (\./)?usr/bin/cumulusvpn-helper$' "$RUNNER_TEMP/deb-contents.txt"
          grep -E '^-rw-r--r-- .* (\./)?usr/lib/systemd/system/cumulusvpn-helper\.service$' "$RUNNER_TEMP/deb-contents.txt"
          dpkg-deb -e "$deb" "$RUNNER_TEMP/deb-control"
          ls -l "$RUNNER_TEMP/deb-control"
          test -x "$RUNNER_TEMP/deb-control/postinst"
          test -x "$RUNNER_TEMP/deb-control/prerm"
          test -x "$RUNNER_TEMP/deb-control/postrm"

          rpm -qlvp "$rpm" | tee "$RUNNER_TEMP/rpm-contents.txt"
          grep -E '^-rwxr-xr-x .* /usr/bin/cumulusvpn-helper$' "$RUNNER_TEMP/rpm-contents.txt"
          grep -E '^-rw-r--r-- .* /usr/lib/systemd/system/cumulusvpn-helper\.service$' "$RUNNER_TEMP/rpm-contents.txt"
          rpm -qp --scripts "$rpm" | tee "$RUNNER_TEMP/rpm-scripts.txt"
          grep -c 'cumulusvpn-helper.service' "$RUNNER_TEMP/rpm-scripts.txt"

          # The daemon cleans up before it binds; give it a moment.
          wait_for_socket() {
            for _ in $(seq 1 50); do sudo test -S /run/cumulusvpn/helper.sock && return 0; sleep 0.2; done
            sudo journalctl -u cumulusvpn-helper --no-pager | tail -n 30; return 1
          }

          sudo apt-get install -y "./$deb"
          systemctl is-active cumulusvpn-helper
          systemctl is-enabled cumulusvpn-helper
          wait_for_socket
          # The postinst created the group and added the installing user.
          getent group cumulusvpn | grep -w "$USER" >/dev/null
          test "$(sudo stat -c '%U:%G %a' /run/cumulusvpn/helper.sock)" = "root:cumulusvpn 660"
          test "$(stat -c '%U:%G %a' /run/cumulusvpn)" = "root:root 755"

          # Root is served.
          sudo /usr/bin/cumulusvpn-helper --ping
          # Without the group in its credentials (this shell predates the
          # membership — the "log out and back in" case): the kernel refuses.
          if /usr/bin/cumulusvpn-helper --ping; then echo "a process without the group was served"; exit 1; fi
          # With the group, but not the app: refused by the peer check.
          out=$(sg cumulusvpn -c '/usr/bin/cumulusvpn-helper --ping' || true)
          echo "$out"
          echo "$out" | grep -q 'refused: not authorised'
          # --cleanup refuses to run under a live daemon.
          if sudo /usr/bin/cumulusvpn-helper --cleanup; then echo "--cleanup ran under a live daemon"; exit 1; fi
          # A stop is clean (SIGTERM is handled), and a restart comes back.
          sudo systemctl restart cumulusvpn-helper
          systemctl is-active cumulusvpn-helper
          wait_for_socket
          sudo /usr/bin/cumulusvpn-helper --ping

          sudo apt-get remove -y "$(dpkg-deb -f "$deb" Package)"
          if systemctl is-active --quiet cumulusvpn-helper; then echo "still running"; exit 1; fi
          if systemctl is-enabled --quiet cumulusvpn-helper 2>/dev/null; then echo "still enabled"; exit 1; fi
          test ! -e /run/cumulusvpn/helper.sock
          if sudo nft list table inet cumulusvpn 2>/dev/null; then echo "kill switch left behind"; exit 1; fi

      # Install both Windows installers for real (docs/16 Stage K): the
      # service is registered (automatic, LocalSystem, quoted path) and
      # running, an elevated --ping is served, and uninstalling removes the
      # service and the helper and leaves no kill-switch rules.
      - name: Verify the Windows helper service (NSIS + MSI install, uninstall)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: clients/desktop/src-tauri/target/${{ matrix.target }}/release/bundle
        run: |
          $ErrorActionPreference = 'Stop'
          # Exit codes are checked by hand below (sc.exe's 1060 is expected).
          $PSNativeCommandUseErrorActionPreference = $false
          $dir = Join-Path $env:ProgramFiles 'CumulusVPN'
          $helper = Join-Path $dir 'cumulusvpn-helper.exe'
          function Assert-Service {
            # Dispose the controller: an open handle would keep the service
            # "marked for deletion" after uninstall.
            $svc = Get-Service CumulusVPNHelper
            try { $svc.WaitForStatus('Running', '00:01:00') } finally { $svc.Dispose() }
            $cfg = Get-CimInstance Win32_Service -Filter "Name='CumulusVPNHelper'"
            if ($cfg.StartMode -ne 'Auto') { throw "start mode: $($cfg.StartMode)" }
            if ($cfg.StartName -ne 'LocalSystem') { throw "account: $($cfg.StartName)" }
            if (-not $cfg.PathName.StartsWith('"')) { throw "unquoted service path: $($cfg.PathName)" }
            & $helper --ping
            if ($LASTEXITCODE -ne 0) { throw 'an elevated --ping was not served' }
          }
          # Signed builds: every installer and every installed binary must carry
          # a Valid, timestamped Authenticode signature (wintun.dll is signed
          # by WireGuard LLC upstream; it is checked too).
          function Assert-Signed([string[]]$paths) {
            if ($env:CVPN_WIN_SIGN -ne '1') { return }
            foreach ($p in $paths) {
              $sig = Get-AuthenticodeSignature -LiteralPath $p
              Write-Host "$($sig.Status)  $p  $($sig.SignerCertificate.Subject)"
              if ($sig.Status -ne 'Valid') { throw "not validly signed: $p ($($sig.Status))" }
              if (-not $sig.TimeStamperCertificate) { throw "no timestamp: $p" }
            }
          }
          function Assert-Gone {
            # 1060: the service does not exist.
            for ($i = 0; $i -lt 50; $i++) {
              sc.exe query CumulusVPNHelper | Out-Null
              if ($LASTEXITCODE -eq 1060) { break }
              Start-Sleep -Milliseconds 200
            }
            if ($LASTEXITCODE -ne 1060) { sc.exe query CumulusVPNHelper; throw 'the service survived uninstall' }
            if (Test-Path $helper) { throw 'the helper survived uninstall' }
            if (Get-NetFirewallRule -Group 'CumulusVPN' -ErrorAction SilentlyContinue) { throw 'kill-switch rules left behind' }
          }

          $nsis = Get-ChildItem nsis/*-setup.exe | Select-Object -First 1
          $msiFile = Get-ChildItem msi/*.msi | Select-Object -First 1
          Assert-Signed @($nsis.FullName, $msiFile.FullName)
          Start-Process -FilePath $nsis.FullName -ArgumentList '/S' -Wait
          Assert-Service
          Assert-Signed ((Get-ChildItem $dir -Recurse -Include *.exe, *.dll).FullName)
          Start-Process -FilePath (Join-Path $dir 'uninstall.exe') -ArgumentList '/S', "_?=$dir" -Wait
          Assert-Gone

          $msi = Get-ChildItem msi/*.msi | Select-Object -First 1
          $log = Join-Path $env:RUNNER_TEMP 'msi.log'
          $p = Start-Process msiexec.exe -ArgumentList '/i', "`"$($msi.FullName)`"", '/qn', '/norestart', '/l*v', "`"$log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content $log -Tail 80; throw "msi install failed: $($p.ExitCode)" }
          Assert-Service
          $p = Start-Process msiexec.exe -ArgumentList '/x', "`"$($msi.FullName)`"", '/qn', '/norestart' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "msi uninstall failed: $($p.ExitCode)" }
          Assert-Gone
          # The runner exits with the last native exit code (sc.exe's 1060).
          exit 0
