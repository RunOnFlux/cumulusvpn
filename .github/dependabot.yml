# Dependabot — keep dependencies current automatically ("always latest").
# Weekly grouped update PRs across every ecosystem in the monorepo. Grouping keeps
# PR noise down (one PR per ecosystem per week). Review + merge as they land; CI
# gates every PR. Most current alerts are transitive dev deps (RN CLI / jest / Tauri)
# that clear once those upstreams release — Dependabot picks those up here.
version: 2
updates:
  - package-ecosystem: npm
    directory: '/' # root TS workspace: core-ts, web, desktop frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      root-npm:
        patterns: ['*']
    ignore:
      # TypeScript 7 (native rewrite) is unusable until typescript-eslint supports
      # it — the latest typescript-eslint peer-caps TS at <6.1.0, and yarn's builtin
      # TS compat patch fails on 7.x. Hold at the newest 5.x. Revisit (remove this)
      # once typescript-eslint ships TS 7 support.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  - package-ecosystem: npm
    directory: '/clients/mobile' # standalone React Native app
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      mobile-npm:
        patterns: ['*']
    ignore:
      # Held at 16.0.2 on purpose: it runs the live purchase flow, so moving to
      # 17.x is its own change, tested with a Play internal-track purchase. The
      # old Kotlin blocker is gone: RN 0.87 runs Kotlin 2.2.0, and 17.0.1
      # (openiap 4.0.1, Kotlin 2.2 metadata) builds on it (see kotlinVersion in
      # clients/mobile/android/build.gradle). Lift this with that change.
      - dependency-name: 'react-native-iap'
        versions: ['>16.0.2']
      # react-native-iap 16 peer-requires nitro-modules ^0.36 (0.37 is outside
      # the 0.x caret range); move it together with the iap upgrade above.
      - dependency-name: 'react-native-nitro-modules'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      # React Native minors change native template files (Gradle, Podfile,
      # AppDelegate), so they go through the upgrade-helper diff by hand, as in
      # PR #98 — never as a package bump alone. React follows RN: each RN minor
      # bundles a renderer built from one React minor (0.87 → 19.2), so React
      # 19.3 waits for the RN release that ships it. Patches still flow.
      - dependency-name: 'react-native'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: '@react-native/*'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: 'react'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: 'react-test-renderer'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      # The RN toolchain (metro, @react-native/babel-preset) is built for Babel 7;
      # Babel 8 in the app while the preset stays on 7 breaks the test/bundle
      # pipeline (PR #30). Lift when React Native declares Babel 8 support.
      - dependency-name: '@babel/core'
        update-types: ['version-update:semver-major']
      - dependency-name: '@babel/runtime'
        update-types: ['version-update:semver-major']
      # @react-native/jest-preset targets jest ^29 — a jest 30 core under a 29
      # environment throws `clearMocksOnScope is not a function`. Move jest
      # WITH the RN preset when RN adopts jest 30, not independently.
      - dependency-name: 'jest'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/jest'
        update-types: ['version-update:semver-major']

  - package-ecosystem: npm
    directory: '/deploy' # standalone deploy tooling
    schedule:
      interval: weekly
    groups:
      deploy-npm:
        patterns: ['*']

  - package-ecosystem: npm
    directory: '/bridge' # standalone fiat-payments bridge service (own yarn.lock)
    schedule:
      interval: weekly
    groups:
      bridge-npm:
        patterns: ['*']
    ignore:
      # Same TypeScript 7 hold as the root workspace (typescript-eslint caps TS).
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # Node types track the runtime: the bridge image runs Node 24 LTS (its
      # Node majors are held below), so @types/node stays on 24.x with it.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: cargo
    directory: '/clients/desktop/src-tauri' # desktop Rust / Tauri
    schedule:
      interval: weekly
    groups:
      desktop-cargo:
        patterns: ['*']

  - package-ecosystem: gradle
    directory: '/clients/mobile/android' # Android native deps
    schedule:
      interval: weekly
    groups:
      android-gradle:
        patterns: ['*']
    ignore:
      # Hold the Gradle wrapper at RN 0.87's version (9.4.1, as in
      # @react-native/gradle-plugin's own wrapper) and move it with RN upgrades. A newer Gradle embeds a newer Kotlin
      # than @react-native/gradle-plugin is built against (Kotlin 2.2.0 on 0.87);
      # on RN 0.86, 9.6.1 broke the APK build that way. ci-ts never runs a gradle
      # build, so a bad bump only fails in android-release. (The
      # com.wireguard.android:tunnel bumps stay allowed.)
      - dependency-name: 'gradle-wrapper'

  - package-ecosystem: bundler
    directory: '/clients/mobile' # Ruby tooling for iOS builds (CocoaPods)
    schedule:
      interval: weekly
    groups:
      mobile-bundler:
        patterns: ['*']

  - package-ecosystem: gomod
    directory: '/gateway' # Go gateway
    schedule:
      interval: weekly
    groups:
      gateway-gomod:
        patterns: ['*']
    ignore:
      # LOAD-BEARING PINS (docs/15): amneziawg-go v0.2.19 + the 20231202 gVisor
      # snapshot, in three lockstep places (gateway/go.mod, wgnest/go.mod,
      # desktop fetch-wireguard-go.sh). Newer gVisor breaks the vendored
      # netstack ("found packages stack and bridge" — PR #29), and AWG 2.0
      # drags exactly that gVisor in. Move all three together, by hand.
      - dependency-name: 'gvisor.dev/gvisor'
      - dependency-name: 'github.com/amnezia-vpn/amneziawg-go'

  # Base images are pinned by tag AND digest; Dependabot bumps both together
  # (a digest-only refresh for non-version tags like distroless `nonroot`).
  - package-ecosystem: docker
    directory: '/gateway' # gateway image: golang build stage + distroless runtime
    schedule:
      interval: weekly
    groups:
      gateway-docker:
        patterns: ['*']

  - package-ecosystem: docker
    directory: '/bridge' # bridge image: node base
    schedule:
      interval: weekly
    groups:
      bridge-docker:
        patterns: ['*']
    ignore:
      # The bridge runs on Node LTS (24, matching setup-node in bridge-image.yml
      # and @types/node 24). Odd/Current majors land here first — move the
      # major deliberately, all three places together, once it becomes LTS.
      - dependency-name: 'node'
        update-types: ['version-update:semver-major']

  # Every `uses:` is pinned to a full commit SHA with the version in a trailing
  # comment; Dependabot updates the SHA and the comment together.
  - package-ecosystem: github-actions
    directory: '/' # workflow action versions
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
