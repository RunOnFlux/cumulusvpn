locale: en
curated: true
# Kicker (label) = ALL CAPS, 1-2 words. Headline = one benefit claim, 3-6
# words, `\n` is a hard line break. Honesty rule: nothing a frame doesn't show.
screens:
  connect:
    label: "CONNECT"
    headline: "One tap.\nEncrypted."
  countries:
    label: "COUNTRIES"
    headline: "Pick a country.\nSee the latency."
  # NO PRICE REFERENCES HERE — not "free", not a number, not "trial". Apple
  # cited 2.3.7 against this frame's previous copy ("FREE TIER / Free to use.
  # Honest limits.") in the 1.0.2 (15) rejection. "Limits" describes the speed
  # cap, which is a product fact, not a price.
  tier:
    label: "HONEST LIMITS"
    headline: "Every limit,\nstated up front."
  multihop:
    label: "MULTI-HOP"
    headline: "Two hops when\none isn't enough."
  brand:
    label: "NO ACCOUNT"
    headline: "No logs.\nPowered by Flux."
